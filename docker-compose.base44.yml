# Base44 sandbox/dev setup: serves the repo's static site straight from the
# cloned source (no build step, no image rebuild on edits).
# The web entry point must be reachable on host port 3000.
name: printer3d

services:
  web:
    image: nginx:alpine
    # The sandbox repo root is mode 700 and bind-mounted as-is, so nginx's
    # default unprivileged worker cannot traverse it (403). Dev-only static
    # server, so docker/nginx.base44.main.conf runs the worker as root.
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.base44.main.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Probes real content of the page, not just an open port.
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=3 http://127.0.0.1/ | grep -q 'Studio 3D' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: on-failure
    labels:
      base44.project: "printer.3D"
      base44.kind: "web"
      base44.port: "3000"
