<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 3D & Paiement Sécurisé</title>
    <!-- Tailwind CSS for modern fluid layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for secure icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8 antialiased">

    <!-- Main Container -->
    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch">
        
        <!-- Left Column: Interactive 3D Viewer -->
        <div class="lg:col-span-7 glass rounded-3xl overflow-hidden flex flex-col relative group min-h-[450px] lg:min-h-[600px] shadow-2xl">
            <!-- Canvas container -->
            <div id="canvas-container" class="w-full flex-1 relative cursor-grab active:cursor-grabbing">
                <!-- Loading indicator -->
                <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0b0f19] z-10 transition-opacity duration-500">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
                    <p class="text-sm text-gray-400 font-medium">Chargement de l'expérience 3D...</p>
                </div>
                <!-- Floating Canvas Controls Info -->
                <div class="absolute top-4 left-4 z-10 glass px-3 py-1.5 rounded-full text-xs font-medium text-gray-300 flex items-center gap-2 pointer-events-none">
                    <i class="fa-solid fa-rotate"></i> 3D Interactive : Faites glisser pour pivoter
                </div>
            </div>
            
            <!-- Product Details Summary -->
            <div class="p-6 bg-gray-900/50 border-t border-white/5 flex justify-between items-center">
                <div>
                    <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Édition Premium</span>
                    <h1 class="text-xl font-bold text-white mt-0.5">Sculpture Abstraite "Éon"</h1>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400">Prix exclusif</p>
                    <p class="text-2xl font-bold text-white">129,00 €</p>
                </div>
            </div>
        </div>

        <!-- Right Column: Checkout & Payments Form -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Stripe style Checkout Widget -->
            <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl flex flex-col justify-between h-full border border-white/10">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-credit-card text-indigo-400"></i> Finaliser la commande
                        </h2>
                        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium flex items-center gap-1.5">
                            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Chiffrement SSL
                        </span>
                    </div>

                    <!-- Express Checkout Options -->
                    <div class="mb-6">
                        <label class="block text-xs font-medium text-gray-400 mb-3 uppercase tracking-wider">Paiement Express</label>
                        <div class="grid grid-cols-2 gap-3">
                            <!-- Simulated PayPal Button -->
                            <button class="w-full bg-[#ffc439] hover:bg-[#f4b41a] transition-all duration-200 py-3 px-4 rounded-xl flex items-center justify-center shadow-lg active:scale-[0.98]">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal" class="h-5">
                            </button>
                            <!-- Simulated Apple Pay / Stripe Button alternative -->
                            <button class="w-full bg-white hover:bg-gray-100 text-black font-semibold transition-all duration-200 py-3 px-4 rounded-xl flex items-center justify-center shadow-lg active:scale-[0.98]">
                                <i class="fa-brands fa-apple text-xl mr-1"></i> Pay
                            </button>
                        </div>
                    </div>

                    <div class="relative flex py-3 items-center mb-6">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="flex-shrink mx-4 text-xs text-gray-500 uppercase tracking-widest">Ou par carte</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>

                    <!-- Stripe Mock Form Inputs -->
                    <form onsubmit="event.preventDefault(); alert('Démonstration : Paiement traité avec succès via Stripe !');" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1.5">Adresse e-mail</label>
                            <input type="email" required placeholder="vous@exemple.com" class="w-full bg-gray-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-gray-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1.5">Informations de carte (Stripe Element)</label>
                            <div class="relative">
                                <input type="text" required placeholder="4242 4242 4242 4242" class="w-full bg-gray-950/60 border border-white/10 rounded-xl pl-4 pr-12 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-gray-600">
                                <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1.5 text-gray-400">
                                    <i class="fa-brands fa-cc-visa text-lg"></i>
                                    <i class="fa-brands fa-cc-mastercard text-lg"></i>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-1.5">Date d'exp.</label>
                                <input type="text" required placeholder="MM / AA" class="w-full bg-gray-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-gray-600 text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-1.5">CVC</label>
                                <input type="text" required placeholder="123" class="w-full bg-gray-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-gray-600 text-center">
                            </div>
                        </div>

                        <!-- Main Stripe Submit Button -->
                        <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-medium py-3.5 px-4 rounded-xl mt-4 shadow-xl shadow-indigo-500/10 transition-all duration-200 active:scale-[0.99] flex items-center justify-center gap-2">
                            <i class="fa-solid fa-lock text-xs opacity-80"></i> Payer 129,00 €
                        </button>
                    </form>
                </div>

                <!-- Trust signals -->
                <div class="mt-6 pt-4 border-t border-white/5 flex items-center justify-between text-[11px] text-gray-500">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved"></i> Garanti Stripe & PayPal</span>
                    <span>🔒 Données 100% sécurisées</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Three.js Implementation Script -->
    <script>
        const container = document.getElementById('canvas-container');
        const loader = document.getElementById('loader');

        // 1. Scene setup
        const scene = new THREE.Scene();
        // Soft cosmic background gradient handled by CSS, scene background transparent
        
        // 2. Camera setup
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 5);

        // 3. Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 4. Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 8;
        controls.minDistance = 3;
        controls.enableZoom = true;

        // 5. Ambient & Directional Lights for micro-shadows and metallic sheen
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 1.5);
        topLight.position.set(5, 10, 7);
        scene.add(topLight);

        const purpleLight = new THREE.PointLight(0x818cf8, 2, 10);
        purpleLight.position.set(-4, -2, 2);
        scene.add(purpleLight);

        const blueLight = new THREE.PointLight(0x38bdf8, 2, 10);
        blueLight.position.set(4, 3, -2);
        scene.add(blueLight);

        // 6. Geometry & Modern Material (Procedural luxury mesh)
        const geometry = new THREE.TorusKnotGeometry(0.8, 0.28, 180, 24, 3, 4);
        
        // High-end glass/metal physical material
        const material = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            transmission: 0.6, // Glass effect
            thickness: 0.5,
            ior: 1.5,
            side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Hide loader once setup is done
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);

        // 7. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // Auto-rotation when user is not interacting
            if(!controls.state == -1 || controls.state === -1) {
                mesh.rotation.y = elapsedTime * 0.15;
                mesh.rotation.x = elapsedTime * 0.08;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 8. Responsive Resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
