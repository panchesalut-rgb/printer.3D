server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index preview_3d_checkout.html;
    autoindex off;

    # Never serve repo metadata or docker config over HTTP.
    location ~ /\. {
        deny all;
    }
    location /docker/ {
        deny all;
    }

    # Always revalidate so edits to the HTML show up on refresh.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
