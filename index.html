<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer 3D - Vente d'objets 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Printer 3D</h1>
        <div class="cart-status">Mon Panier (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <section class="hero">
            <h2>Découvrez nos impressions et modèles 3D uniques</h2>
            <p>Haute qualité, plastique éco-responsable et designs sur mesure.</p>
        </section>

        <section class="products">
            <!-- Produit 1 -->
            <div class="product-card">
                <div class="product-thumb">📦</div>
                <h3>Support de Téléphone</h3>
                <p class="price">14.99 €</p>
                <button onclick="addToCart('Support Téléphone', 14.99)">Ajouter au panier</button>
            </div>

            <!-- Produit 2 -->
            <div class="product-card">
                <div class="product-thumb">🦖</div>
                <h3>Figurine T-Rex Articulée</h3>
                <p class="price">19.99 €</p>
                <button onclick="addToCart('Figurine T-Rex', 19.99)">Ajouter au panier</button>
            </div>

            <!-- Produit 3 -->
            <div class="product-card">
                <div class="product-thumb">⚙️</div>
                <h3>Engrenage de remplacement</h3>
                <p class="price">4.99 €</p>
                <button onclick="addToCart('Engrenage', 4.99)">Ajouter au panier</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Printer 3D. Propulsé par GitHub Pages.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
